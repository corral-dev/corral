[package]
name = "corral-native"
version = "0.24.278"
edition = "2021"
description = "Native hot-path accelerator for corral"
homepage = "https://github.com/corral-dev/corral"
repository = "https://github.com/corral-dev/corral"
license = "MIT"

[lib]
name = "_native"
crate-type = ["cdylib"]
path = "rust/lib.rs"

[dependencies]
pyo3 = { version = "0.23", features = ["abi3-py310", "extension-module"] }
unicode-width = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
