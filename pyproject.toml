[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "corral"
version = "0.24.226"
description = "Corral: terminal session handoff for Claude Code, Codex CLI, OpenCode, Kimi Code CLI, Cursor Agent CLI, and Pi."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Corral contributors" }]
keywords = [
  "claude-code",
  "codex-cli",
  "opencode",
  "kimi-code",
  "cursor-cli",
  "pi-agent",
  "terminal",
  "tui",
  "session-manager",
  "ai-coding-agent",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
  "Topic :: Terminals",
]
dependencies = [
  "textual>=8.0",
  "websockets>=13",
  # Until SessKit is on PyPI, pip/git users install sesskit from GitHub; Homebrew
  # vendors it as a formula resource so offline brew installs still work.
  "sesskit>=0.1.10",
]

# 手机端接力（corral remote）需要的额外组件。刻意不进主依赖：只在终端里用 corral
# 的人不该为一个用不上的功能付出安装体积和导入时间。
[project.optional-dependencies]
remote = [
  "cryptography>=42",
  "segno>=1.6",
  # Only used for mDNS LAN discovery broadcast; the daemon degrades silently
  # (observe event `remote_mdns_unavailable`) when it is missing.
  "zeroconf>=0.131",
]

[project.urls]
Homepage = "https://github.com/x0c/corral"
Issues = "https://github.com/x0c/corral/issues"

[project.scripts]
corral = "corral.bootstrap:main"

[tool.maturin]
python-source = "src"
module-name = "corral._native"
features = ["pyo3/abi3-py310"]
include = ["corral/ui/assets/*.json", "corral/pi_extension/*.ts"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# 阶段一：只开未定义名 / 未使用导入 / 语法级错误；阶段五扩展到
# pycodestyle 全量、import 排序、语法现代化与常见陷阱。
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# 测试夹具要求 import 前先设环境变量 / 隔离目录（如 CORRAL_CACHE_DIR、
# sidebar 状态目录），模块级 import 不放在顶部是刻意为之，不是疏忽。
"tests/*.py" = ["E402"]
