name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的版本标签（如 v0.24.2）"
        required: true

permissions:
  contents: write

jobs:
  # 发布不得在测试仍失败时更新正式下载与 Homebrew。核对「同一提交」上的 test
  # 工作流已成功；本机 publish-release.sh 另有同源 ci-test 门禁。
  require-tests:
    runs-on: ubuntu-latest
    # test 工作流实测 10-12 分钟（v0.24.237 成功 10m41s、v0.24.238 失败 12m3s）；
    # 内部等待 deadline 是 1500s（25 分钟）。job 超时必须大于两者之和，
    # 否则每次都在 10 分钟被取消，Linux 轮子永远补不上（2026-09-30 连踩 6 版）。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require successful test workflow for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "Looking for successful test run on ${sha}"
          # Prefer an already-green run on this exact SHA (push to main before tagging).
          # Fall back: if none yet, wait briefly — tag push can race the branch test.
          deadline=$((SECONDS + 1500))
          while true; do
            conclusion="$(
              gh api "repos/${{ github.repository }}/actions/workflows/test.yml/runs?head_sha=${sha}&status=completed&per_page=20" \
                --jq '[.workflow_runs[] | select(.conclusion=="success")] | first | .conclusion // empty'
            )"
            if [ "$conclusion" = "success" ]; then
              echo "Found successful test workflow for ${sha}"
              exit 0
            fi
            in_progress="$(
              gh api "repos/${{ github.repository }}/actions/workflows/test.yml/runs?head_sha=${sha}&per_page=10" \
                --jq '[.workflow_runs[] | select(.status!="completed")] | length'
            )"
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::No successful test.yml run for commit ${sha}. Refuse to release."
              gh api "repos/${{ github.repository }}/actions/workflows/test.yml/runs?head_sha=${sha}&per_page=10" \
                --jq '.workflow_runs[] | "\(.id) \(.status) \(.conclusion) \(.html_url)"' || true
              exit 1
            fi
            if [ "${in_progress:-0}" -gt 0 ]; then
              echo "Test still running for ${sha}; waiting…"
            else
              echo "No successful test yet for ${sha}; waiting in case a run is queued…"
            fi
            sleep 30
          done

  wheels:
    needs: require-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: "2_17" }
          - { os: ubuntu-latest, target: aarch64, manylinux: "2_17" }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          - { os: macos-latest, target: universal2, manylinux: auto }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux }}
          path: dist/*.whl

  source:
    needs: require-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install 'maturin>=1.9,<2'
      - run: maturin sdist --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: dist/*.tar.gz

  github-release:
    needs: [wheels, source]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - id: tag
        run: echo "value=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist
          merge-multiple: true
      - run: sha256sum dist/* > dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          generate_release_notes: true
          files: dist/*

  bump-homebrew-formula:
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate Homebrew formula (wheel-first)
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.github-release.outputs.tag }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          git clone "https://x-access-token:${COMMITTER_TOKEN}@github.com/x0c/homebrew-tap.git" tap
          # 生成器优先用预编译 wheel（免 Rust 工具链），缺 wheel 的平台回退源码编译；
          # 自带防回退（tap 里配方已是更新版本就跳过，退出码 3）--排队积压时旧
          # tag 的 bump 任务晚执行也不能把版本写回去。
          rc=0
          GITHUB_API_TOKEN="${COMMITTER_TOKEN}" \
            python3 scripts/homebrew_formula.py --tag "${VERSION}" --tap-dir tap || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "配方已是更新的版本，跳过回写 ${version}"
            exit 0
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
          if git -C tap diff --quiet -- Formula/corral.rb; then exit 0; fi
          git -C tap config user.name "github-actions[bot]"
          git -C tap config user.email "github-actions[bot]@users.noreply.github.com"
          git -C tap add Formula/corral.rb
          git -C tap commit -m "corral ${version}"
          git -C tap push origin main
