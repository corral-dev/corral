name: test

on:
  # 只跑分支推送。tag 推送会与发布同一个提交在 main 上的推送产生完全重复的一轮
  # 矩阵（每次发版凭空多出 7 个作业），在免费并发额度下直接翻倍排队时间。
  push:
    branches: ["**"]
  pull_request:

# 同一分支上后推的提交作废前一轮：连续发版时旧提交的矩阵还在排队就已经没有意义，
# 继续占着 runner 只会让新提交等更久。
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 快速门禁：依赖可下载、版本文件可解析、格式正确。整矩阵装不上时不必占满七组 runner。
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # pip 缓存只加速下载：键绑定到固定依赖输入（pyproject + uv.lock +
          # 权威 SessKit pin），命中与否都不改变实际安装的版本。
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            uv.lock
            scripts/sesskit_dep.py
      - name: Verify SessKit pin and package metadata
        run: |
          set -euo pipefail
          python3 scripts/sesskit_dep.py verify
          python3 - <<'PY'
          import pathlib, re, tomllib
          root = pathlib.Path(".")
          data = tomllib.loads((root / "pyproject.toml").read_text(encoding="utf-8"))
          version = data["project"]["version"]
          assert re.fullmatch(r"\d+\.\d+\.\d+", version), version
          init = (root / "src/corral/__init__.py").read_text(encoding="utf-8")
          m = re.search(r'^__version__\s*=\s*"([^"]+)"', init, re.M)
          assert m and m.group(1) == version, (m.group(1) if m else None, version)
          cargo = (root / "Cargo.toml").read_text(encoding="utf-8")
          cm = re.search(r'^version\s*=\s*"([^"]+)"', cargo, re.M)
          assert cm and cm.group(1) == version, (cm.group(1) if cm else None, version)
          deps = data["project"]["dependencies"]
          assert any(d.startswith("sesskit>=") for d in deps), deps
          print(f"ok metadata {version}")
          PY
          python3 -m pip install -q "$(python3 scripts/sesskit_dep.py wheel-requirement)"
          python3 -c "import sesskit; print('ok', getattr(sesskit, '__version__', '?'))"
      - name: Lint
        # 唯一的 Ruff 门禁：版本固定（防规则集自行漂移），源码同一份在各矩阵
        # job 里完全相同，不随 Python 版本变化，矩阵内不再重复跑。
        run: |
          python3 -m pip install -q ruff==0.16.1
          ruff check src tests

  python:
    needs: preflight
    runs-on: ${{ matrix.os }}
    # 单测正常十分钟量级。没有这行时，挂死的作业会一直占着 runner 到平台 6 小时
    # 上限——macOS 免费并发少，两个僵尸作业就能把后面的排队拖到十几小时。
    timeout-minutes: 40
    strategy:
      # 一路挂了就取消其余矩阵，少收重复失败邮件、少占免费并发。
      # 排查「只在某一 Python / OS 挂」时可临时改 false 看全矩阵，修完改回。
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, python-version: "3.10" }
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: ubuntu-latest, python-version: "3.13" }
          - { os: ubuntu-latest, python-version: "3.14" }
          - { os: macos-latest, python-version: "3.10" }
          - { os: macos-latest, python-version: "3.14" }

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # 与 preflight 同一套固定依赖输入：缓存只省下载时间，不参与版本决策。
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            uv.lock
            scripts/sesskit_dep.py
      - name: Install tmux
        # Linux runners do not guarantee tmux; without it hosted-pane tests stay on
        # the static "Press Enter to restart" frame and fail after 6s waits.
        # ncurses-term provides tmux-256color (absent from minimal Ubuntu images).
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            brew install tmux
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq tmux ncurses-term
          fi
          tmux -V
          infocmp tmux-256color >/dev/null 2>&1 && echo "terminfo: tmux-256color ok" \
            || echo "terminfo: tmux-256color missing (keepalive falls back)"
      - name: Install project and runtime dependencies
        # SessKit 尚未上 PyPI：先按 scripts/sesskit_dep.py 的固定 Release 安装，
        # 再装本项目；带上 remote 附加组件，手机接力单测才不会整组跳过。
        run: |
          set -euo pipefail
          python -m pip install "$(python scripts/sesskit_dep.py wheel-requirement)"
          python -m pip install ".[remote]"
      - name: Smoke host_session
        # Fail fast if keepalive new-session is broken on this runner before the
        # full suite. Keep setup-python's LD_LIBRARY_PATH so product sanitization
        # stays covered. Print stepwise probes so the next failure names the
        # layer (bare tmux / conf / host_session) instead of only EmbedError.
        env:
          TERM: xterm-256color
        run: |
          python - <<'PY'
          import os, shutil, subprocess, traceback
          keys = ("HOME", "LANG", "LC_ALL", "LD_LIBRARY_PATH", "RUNNER_TRACKING_ID",
                  "TERM", "TMPDIR", "TMUX_TMPDIR", "GITHUB_ACTIONS", "RUNNER_OS")
          for k in keys:
              print(f"{k}={os.environ.get(k)!r}")
          tmux = shutil.which("tmux")
          print("tmux=", tmux)
          if tmux and os.name == "posix":
              try:
                  print(subprocess.check_output(["ldd", tmux], text=True, stderr=subprocess.STDOUT)[:800])
              except (OSError, subprocess.CalledProcessError) as exc:
                  print("ldd skipped:", exc)

          def run(label, argv, env=None):
              r = subprocess.run(argv, capture_output=True, env=env)
              print(label, "rc=", r.returncode,
                    "stderr=", (r.stderr or b"")[:300],
                    "stdout=", (r.stdout or b"")[:120])
              return r

          run("bare", ["tmux", "-L", "ci-bare", "-f", "/dev/null",
                       "new-session", "-d", "-s", "bare", "--",
                       "bash", "-c", "printf BARE; sleep 1"])
          subprocess.run(["tmux", "-L", "ci-bare", "kill-server"], capture_output=True)

          from corral import embed, keepalive
          from corral.models import LaunchPlan
          env = keepalive.tmux_env()
          print("tmux_env LD=", env.get("LD_LIBRARY_PATH"),
                "TRACK=", env.get("RUNNER_TRACKING_ID"),
                "TMUX_TMPDIR=", env.get("TMUX_TMPDIR"),
                "LANG=", env.get("LANG"))
          conf = keepalive._ensure_config_file()
          print("conf=", conf)
          print(open(conf, encoding="utf-8").read())
          run("conf", [*keepalive.tmux_argv(), "-f", conf,
                       "new-session", "-d", "-P", "-F", "#{pane_id}",
                       "-s", "ci-conf", "-x", "80", "-y", "24", "--",
                       "bash", "-c", "printf CONF; sleep 1"], env=env)
          subprocess.run([*keepalive.tmux_argv(), "kill-server"], capture_output=True, env=env)

          plan = LaunchPlan(("bash", "-c", "printf 'CI-HOST-SMOKE\\n'; sleep 2"), None)
          try:
              name = embed.host_session(plan, "claude", "cihostsmoke01", 80, 24)
          except Exception:
              traceback.print_exc()
              raise
          assert embed.is_alive(name), name
          text = embed.capture(name) or ""
          assert "CI-HOST-SMOKE" in text, repr(text)
          keepalive.kill(name)
          print("ok host_session", name)
          PY
      - name: Compile
        run: python -m compileall -q src/corral tests
      - name: Test
        # 走 scripts/ci-test.py 而不是裸 unittest：挂死时自动打印全部线程栈，
        # 已知 Pilot 偶发自动重跑一次再判定。说明见该脚本头部注释。
        env:
          TERM: xterm-256color
        run: python scripts/ci-test.py --skip-lint
      - name: Verify native accelerator
        run: python -c "from corral.native import available; assert available()"
